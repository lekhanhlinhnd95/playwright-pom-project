name: Playwright CI

# Định nghĩa thời điểm pipeline này tự động kích hoạt
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # Chạy trên máy chủ ảo Linux miễn phí của GitHub

    steps:
    # 1. Checkout mã nguồn từ GitHub xuống máy chủ ảo
    - uses: actions/checkout@v4

    # 2. Cài đặt môi trường Node.js (phiên bản 20)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 3. Cài đặt các thư viện trong package.json
    - name: Install dependencies
      run: npm ci

    # 4. Cài đặt trình duyệt Playwright và các dependencies cần thiết trên Linux
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 5. Thực thi toàn bộ test suite
    - name: Run Playwright tests
      run: npx playwright test

    # 6. Lưu lại báo cáo kết quả (HTML Report) dưới dạng Artifact để tải về xem khi cần
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30